[workspace]
members = ["sharpview-rs"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SharpView Contributors"]
license = "MIT"
repository = "https://github.com/volume19/SharpView"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["serde", "v4"] }
